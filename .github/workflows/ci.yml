name: CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Set up Python 3.11
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install pytest httpx fastapi uvicorn pydantic python-dotenv             psycopg2-binary joblib lightgbm scikit-learn shap groq             faiss-cpu sentence-transformers langchain langgraph langchain-groq

      - name: Create dummy .env for tests
        run: |
          echo 
